<nz-drawer [nzBodyStyle]="{ overflow: 'auto' }" [nzMaskClosable]="false" [nzWidth]="drawerWidth"
    [nzVisible]="visible$.value" nzTitle="{{'PAGE.PROFILE.SKILL.EDIT.TITLE'| translate}}" [nzFooter]="footerTpl"
    (nzOnClose)="close()">
    <form nz-form *nzDrawerContent [formGroup]="validateForm" nzLayout="vertical">
        <div nz-row [nzGutter]="8">
            <div nz-col nzSpan="18">
                <nz-form-item>
                    <nz-form-label nzRequired nzLabelAlign="left">
                        {{'PAGE.PROFILE.SKILL.EDIT.INPUT.SKILL'|translate}}
                    </nz-form-label>
                    <nz-form-control [nzErrorTip]="( 'PAGE.PROFILE.SKILL.EDIT.ERR.SKILL' | translate )">
                        <nz-input-group [nzSuffix]="skillInputClearTlp">
                            <input type="text" nz-input formControlName="skill" id="skill" maxlength="255"
                                placeholder="{{'PAGE.PROFILE.SKILL.EDIT.PLACEHOLDER.SKILL' | translate}}" />
                        </nz-input-group>
                        <ng-template #skillInputClearTlp>
                            <nz-icon *ngIf="this.validateForm.get('skill')?.value" class="ant-input-clear-icon"
                                nzTheme="fill" nzType="close-circle"
                                (click)="validateForm.get('skill')?.setValue('')" />
                        </ng-template>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
        <div nz-row [nzGutter]="8">
            <div nz-col nzSpan="18">
                <nz-form-item>
                    <nz-form-label nzLabelAlign="left">
                        {{'PAGE.PROFILE.SKILL.EDIT.INPUT.DESC'|translate}}
                    </nz-form-label>
                    <nz-form-control>
                        <nz-input-group [nzSuffix]="textAreaClearTpl">
                            <textarea nz-input formControlName="description" id="description" maxlength="1000"
                                placeholder="{{'PAGE.PROFILE.SKILL.EDIT.PLACEHOLDER.DESC' | translate}}">
                                </textarea>
                        </nz-input-group>
                        <ng-template #textAreaClearTpl>
                            <nz-icon *ngIf="this.validateForm.get('description')?.value" class="ant-input-clear-icon"
                                nzTheme="fill" nzType="close-circle"
                                (click)="validateForm.get('description')?.setValue('')" />
                        </ng-template>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
        <div nz-row [nzGutter]="8">
            <div nz-col nzSpan="18">
                <nz-form-item>
                    <nz-form-label nzRequired nzLabelAlign="left">
                        {{'PAGE.PROFILE.SKILL.EDIT.INPUT.PROF'|translate}}
                    </nz-form-label>
                    <nz-form-control [nzErrorTip]="( 'PAGE.PROFILE.SKILL.EDIT.ERR.PROF' | translate )">
                        <nz-select formControlName="proficiency" id="proficiency"
                            nzPlaceHolder="{{'PAGE.PROFILE.SKILL.EDIT.PLACEHOLDER.PROF' | translate}}">
                            <nz-option [nzLabel]="proficiency.label" [nzValue]="proficiency.value"
                                *ngFor="let proficiency of proficiencyOptions">
                            </nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
    </form>

    <ng-template #footerTpl>
        <div style="float: right">
            <button nz-button style="margin-right: 8px;" (click)="close()">
                {{'PAGE.PROFILE.SKILL.EDIT.BUTTON.CANCEL'| translate}}
            </button>
            <button nz-button nzType="primary" (click)="showConfirm()">
                {{'PAGE.PROFILE.SKILL.EDIT.BUTTON.SUBMIT'| translate}}
            </button>
        </div>
    </ng-template>

</nz-drawer>
