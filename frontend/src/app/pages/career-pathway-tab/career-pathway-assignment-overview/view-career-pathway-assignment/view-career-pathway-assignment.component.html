<nz-drawer *ngIf="hasAccess(['CAN_MANAGE_CAREER_PATHWAY','CAN_MANAGE_STAFF'])" [nzBodyStyle]="{ overflow: 'auto' }"
    [nzMaskClosable]="false" [nzWidth]="drawerWidth" [nzVisible]="visible$.value"
    nzTitle="{{data?.careerPathwayName}} - {{data?.orgChartName}}" [nzFooter]="footerTpl" (nzOnClose)="close()">
    <div *nzDrawerContent>
        <nz-empty nzNotFoundImage="simple" *ngIf="!data"></nz-empty>
        <div class="expanded-panel">
            <h4 class="detail-title" style="margin-bottom: 5px;">
                <nz-icon nzType="ordered-list" nzTheme="outline" />
                {{'PAGE.CAREER_PATHWAY.ASSIGNMENT.TABLE.STAFF.STAFF' | translate}}
            </h4>
            <nz-empty nzNotFoundImage="simple" *ngIf="data?.staffs?.length! === 0"></nz-empty>
            <div nz-row [nzGutter]="[16, 16]" *ngIf="data?.staffs?.length! > 0">
                <div nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8" *ngFor="let staff of data?.staffs">

                    <nz-card [nzActions]="[actionView]" nzHoverable class="staff-card">
                        <nz-card-meta [nzTitle]="staff.name ?? '-'" [nzDescription]="staff.email">
                        </nz-card-meta>
                    </nz-card>

                    <ng-template #actionView>
                        <div (click)="viewProfile(staff.id)" class="card-action"
                            *ngIf="hasAccess(['CAN_MANAGE_STAFF', 'CAN_VIEW_STAFF'])">
                            <nz-icon nzType="eye" nzTheme="outline" />
                            <span style="margin-left: 8px;">
                                {{'PAGE.ROLE.ASSIGNMENT.TABLE.STAFF.VIEW' | translate}}
                            </span>
                        </div>
                    </ng-template>
                </div>
            </div>
        </div>
    </div>

    <ng-template #footerTpl>
        <div style="float: right">
            <button nz-button style="margin-right: 8px;" (click)="close()">
                {{'PAGE.COMPETENCY.OVERVIEW.BUTTON.CANCEL'| translate}}
            </button>
        </div>
    </ng-template>
</nz-drawer>
