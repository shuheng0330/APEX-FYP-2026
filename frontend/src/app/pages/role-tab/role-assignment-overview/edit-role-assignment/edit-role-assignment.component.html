<nz-drawer *ngIf="hasAccess(['CAN_MANAGE_ROLE', 'CAN_MANAGE_STAFF'])" [nzBodyStyle]="{ overflow: 'auto' }"
    [nzMaskClosable]="false" [nzWidth]="drawerWidth" [nzVisible]="visible$.value"
    nzTitle="{{'PAGE.ROLE.ASSIGNMENT.EDIT.TITLE'| translate}}" [nzFooter]="footerTpl" (nzOnClose)="close()">
    <form nz-form *nzDrawerContent [formGroup]="validateForm" nzLayout="vertical">
        <div nz-row [nzGutter]="8">
            <div nz-col nzSpan="18">
                <nz-form-item>
                    <nz-form-label nzRequired [nzSm]="8" [nzXs]="26" nzLabelAlign="left">
                        {{'PAGE.ROLE.ASSIGNMENT.EDIT.INPUT.DEPARTMENT'|translate}}
                    </nz-form-label>
                    <nz-form-control [nzErrorTip]="( 'PAGE.ROLE.ASSIGNMENT.EDIT.ERR.DEPARTMENT' | translate )">
                        <nz-select nzDisabled nzShowSearch nzAllowClear formControlName="department" id="department"
                            nzPlaceHolder="{{'PAGE.ROLE.ASSIGNMENT.EDIT.PLACEHOLDER.DEPARTMENT' | translate}}">
                            <nz-option [nzLabel]="selectedOrgChartName" [nzValue]="selectedOrgChartId">
                            </nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
        <div nz-row [nzGutter]="8">
            <div nz-col nzSpan="18">
                <nz-form-item>
                    <nz-form-label nzRequired [nzSm]="8" [nzXs]="26" nzLabelAlign="left">
                        {{'PAGE.ROLE.ASSIGNMENT.EDIT.INPUT.ROLE'|translate}}
                    </nz-form-label>
                    <nz-form-control>
                        <nz-select nzDisabled nzShowSearch nzAllowClear
                            nzPlaceHolder="{{ 'PAGE.ROLE.ASSIGNMENT.EDIT.PLACEHOLDER.ROLE' | translate}}" id="role"
                            formControlName="role">
                            <nz-option [nzLabel]="selectedRoleName" [nzValue]="selectedRoleId">
                            </nz-option>
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
        <div nz-row [nzGutter]="8">
            <div nz-col nzSpan="18">
                <nz-form-item>
                    <nz-form-label [nzSm]="8" [nzXs]="26" nzLabelAlign="left">
                        {{'PAGE.ROLE.ASSIGNMENT.EDIT.INPUT.STAFF'| translate}}
                    </nz-form-label>
                    <nz-form-control>
                        <nz-select formControlName="staff" id="staff" nzMode="multiple"
                            nzPlaceHolder="{{'PAGE.ROLE.ASSIGNMENT.EDIT.PLACEHOLDER.STAFF'| translate}}"
                            (nzOnSearch)="staffSearch($event)" nzServerSearch>
                            @for (staff of selectedStaffList; track staff) {
                            <nz-option nzCustomContent [nzValue]="staff.id!" [nzLabel]="staff.email">
                                <p *ngIf="staff.email && !staff.name">{{staff.email}}</p>
                                <p *ngIf="staff.email && staff.name">{{staff.name}}
                                    <br /><b>({{staff.email}})</b>
                                </p>
                            </nz-option>
                            }
                        </nz-select>
                    </nz-form-control>
                </nz-form-item>
            </div>
        </div>
    </form>

    <ng-template #footerTpl>
        <div style="float: right">
            <button nz-button style="margin-right: 8px;" (click)="close()">
                {{'PAGE.ROLE.ASSIGNMENT.EDIT.BUTTON.CANCEL'| translate}}
            </button>
            <button nz-button nzType="primary" (click)="showConfirm()">
                {{'PAGE.ROLE.ASSIGNMENT.EDIT.BUTTON.SUBMIT'| translate}}
            </button>
        </div>
    </ng-template>

</nz-drawer>
