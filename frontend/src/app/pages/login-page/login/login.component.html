<app-auth-shell>
  <div class="auth-form-header">
    <span class="eyebrow">{{ 'AUTH.LOGIN.EYEBROW' | translate }}</span>
    <h1>{{ 'AUTH.LOGIN.TITLE' | translate }}</h1>
    <p>{{ 'AUTH.LOGIN.INPUT.DETAILS' | translate }}</p>
  </div>

  @if (hasError) {
    <div class="auth-error">
      <nz-alert nzType="error" [nzMessage]="errorTitle" [nzDescription]="errorMessage" nzShowIcon></nz-alert>
    </div>
  }

  <form class="auth-form auth-panel-form" [formGroup]="validateForm" (ngSubmit)="submitForm()" method="post"
    action="/login" autocomplete="on">
    <label class="field-label" for="login-email">{{ 'AUTH.LOGIN.INPUT.EMAIL' | translate }}</label>
    <nz-form-item>
      <nz-form-control nzErrorTip="{{ 'AUTH.LOGIN.ERR.EMAIL' | translate }}">
        <nz-input-group nzPrefixIcon="mail">
          <input id="login-email" type="email" maxlength="255" nz-input formControlName="email"
            placeholder="{{ 'AUTH.LOGIN.INPUT.EMAIL' | translate }}" autocomplete="username"
            oninput="this.value = this.value.trim().toLowerCase();" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>

    <label class="field-label" for="login-password">{{ 'AUTH.LOGIN.INPUT.PASS' | translate }}</label>
    <nz-form-item>
      <nz-form-control nzErrorTip="{{ 'AUTH.LOGIN.ERR.PASS' | translate }}">
        <nz-input-group nzPrefixIcon="lock">
          <input id="login-password" [type]="isPasswordVisible ? 'text' : 'password'" maxlength="128" nz-input
            formControlName="password" placeholder="{{ 'AUTH.LOGIN.INPUT.PASS' | translate }}" autocomplete="current-password" />
          <nz-icon class="password-toggle" [nzType]="isPasswordVisible ? 'eye' : 'eye-invisible'" nzTheme="outline"
            (click)="isPasswordVisible = !isPasswordVisible" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>

    <div class="auth-links">
      <a (click)="firstTimeLogin()">{{ 'AUTH.LOGIN.FIRST' | translate }}</a>
      <a (click)="forgotPassword()">{{ 'AUTH.LOGIN.FORGOT' | translate }}</a>
    </div>

    <button [disabled]="!validateForm.valid" nz-button class="auth-primary-button" nzType="primary">
      {{ 'AUTH.LOGIN.SIGNIN' | translate }}
    </button>
  </form>
</app-auth-shell>
