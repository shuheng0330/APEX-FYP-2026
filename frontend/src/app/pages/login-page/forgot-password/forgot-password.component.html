<app-auth-shell>
  <div class="auth-form-header">
    <span class="eyebrow">{{ 'AUTH.FORGOT_PASSWORD.EYEBROW' | translate }}</span>
    <h1>{{ 'AUTH.FORGOT_PASSWORD.TITLE' | translate }}</h1>
    <p>{{ 'AUTH.FORGOT_PASSWORD.INSTRUCTION' | translate }}</p>
  </div>

  @if (hasError) {
    <div class="auth-error">
      <nz-alert nzType="error" [nzMessage]="errorTitle" [nzDescription]="errorMessage" nzShowIcon></nz-alert>
    </div>
  }

  <form nz-form [formGroup]="validateForm" class="auth-form auth-panel-form" (ngSubmit)="submitForm()">
    <label class="field-label" for="forgot-email">{{ 'AUTH.FORGOT_PASSWORD.INPUT.EMAIL' | translate }}</label>
    <nz-form-item>
      <nz-form-control nzErrorTip="{{ 'AUTH.FORGOT_PASSWORD.ERR.EMAIL' | translate }}">
        <nz-input-group nzPrefixIcon="mail">
          <input id="forgot-email" type="email" nz-input formControlName="email"
            oninput="this.value = this.value.trim().toLowerCase();" maxlength="255"
            placeholder="{{ 'AUTH.FORGOT_PASSWORD.INPUT.EMAIL' | translate }}" autocomplete="username" />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>

    <button [disabled]="!validateForm.valid" nz-button class="auth-primary-button" nzType="primary">
      {{ 'AUTH.FORGOT_PASSWORD.SEND' | translate }}
    </button>
    <a class="auth-back-link" (click)="backToLogin()">
      <nz-icon nzType="left" nzTheme="outline" />
      {{ 'AUTH.FORGOT_PASSWORD.BACK' | translate }}
    </a>
  </form>
</app-auth-shell>
