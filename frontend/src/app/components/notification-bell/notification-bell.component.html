<button nz-button nzType="text" class="bell-button" nz-popover nzPopoverTrigger="click" nzPopoverPlacement="bottomRight"
        [nzPopoverContent]="panel" [nzPopoverVisible]="open" (nzPopoverVisibleChange)="onOpenChange($event)"
        nzPopoverOverlayClassName="notification-popover"
        [attr.aria-label]="(unread ? 'NOTIFICATIONS.UNREAD_COUNT' : 'NOTIFICATIONS.TITLE') | translate:{count: unread}">
  <nz-badge [nzCount]="unread" [nzOverflowCount]="99" nzSize="small">
    <nz-icon nzType="bell" nzTheme="outline"></nz-icon>
  </nz-badge>
</button>

<ng-template #panel>
  <div class="panel">
    <div class="panel-head">
      <strong>{{ 'NOTIFICATIONS.TITLE' | translate }}</strong>
      @if (unread) {
        <button type="button" class="link-button" [disabled]="navigating" (click)="markAllRead()">{{ 'NOTIFICATIONS.MARK_ALL' | translate }}</button>
      }
    </div>
    @if (navigationError) { <p class="panel-state" role="alert">{{ navigationError }}</p> }
    @if (loading && !items.length) {
      <div class="panel-state"><nz-spin nzSimple></nz-spin></div>
    } @else if (failed) {
      <div class="panel-state">
        <p>{{ 'NOTIFICATIONS.LOAD_ERROR' | translate }}</p>
        <button nz-button nzSize="small" (click)="load()">{{ 'NOTIFICATIONS.RETRY' | translate }}</button>
      </div>
    } @else if (!items.length) {
      <nz-empty class="panel-state" [nzNotFoundContent]="'NOTIFICATIONS.EMPTY' | translate"></nz-empty>
    } @else {
      <ul class="list" [attr.aria-label]="'NOTIFICATIONS.TITLE' | translate" [attr.aria-busy]="navigating">
        @for (n of items; track n.id) {
          <li>
            <button type="button" class="item" [disabled]="navigating" [class.unread]="!n.read" (click)="openItem(n)">
              @if (!n.read) { <span class="dot" [attr.aria-label]="'NOTIFICATIONS.UNREAD' | translate"></span> }
              <span class="item-text">
                <span class="item-title">{{ n.title }}</span>
                <span class="item-body">{{ n.body }}</span>
                <span class="item-time">{{ timeAgo(n.createdAt) }}</span>
              </span>
            </button>
          </li>
        }
      </ul>
    }
  </div>
</ng-template>
