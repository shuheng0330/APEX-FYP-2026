cookies:
  secure: false

# Development never emails real staff: every notification email goes to the one test inbox in
# NOTIFICATION_EMAIL_REDIRECT (backend/.env), and without it no notification email is sent.
training:
  notifications:
    redirect-to: ${NOTIFICATION_EMAIL_REDIRECT:}
    require-redirect: true

# Flyway stays disabled (base config): the migrations are an incremental history that
# assumes a pre-existing base schema. Hibernate ddl-auto:update builds the full schema
# from entities instead. Seed data is loaded separately (teammate DB dump or manual seed).



