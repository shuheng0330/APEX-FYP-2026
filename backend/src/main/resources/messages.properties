# Template header notes
orgchart.type.notes=Indicates whether the row defines a person (P) or a department (D).
orgchart.name.notes=The unique name of the person or department. (Max 100 characters)
orgchart.parent.name.notes=(Optional) Refers to the parent node (person or department) this item reports to.
orgchart.rename.notes=New name to rename an existing node. Must be unique across all 'Name' and 'Rename To' values.
orgchart.deleted.notes=Indicates whether the node should be deleted. 'Yes' if deletion is confirmed.
role.overview.department.name.notes=Department to which the role belongs. Must exactly match an existing department name in the system.
