role.overview.jobScopes.notes=Job responsibilities assigned to this role; use ';' to separate multiple entries. (Optional)
role.overview.visibility.notes=Determines whether the role is visible to users without permission. Enter 'Yes' to make the role visible to anyone.
role.overview.new.department.name.notes=New department to assign the role to. Must exactly match an existing department name. (Optional)
role.overview.new.role.name.notes=New name to apply if renaming the role. Must be unique within the same department. (Optional)
role.overview.new.role.deleted.notes=Indicates if the role should be deleted. Enter 'Yes' to request deletion. (Optional)
role.assignment.department.name.notes=Department to which the role belongs. Must match a valid department name.
