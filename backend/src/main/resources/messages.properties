#Authorities Description Label
auth.role.user.desc=The standard user role, giving basic access to view their own profile and use core application features.
auth.can.view.access.control.desc=Allows a user to view the system's access control settings for auditing and monitoring, without the ability to make changes.
auth.can.manage.access.control.desc=Allows a user to modify the system's access control settings.
auth.can.view.staff.desc=Allows a user to view all staff details within the organization.
auth.can.manage.staff.desc=Allows a user to manage staff accounts within the organization.
auth.can.view.invisible.role.desc=Allows a user to see the invisible roles within each department. This is a read-only permission.
auth.can.manage.role.desc=Gives a user the ability to manage roles within each department.
auth.can.manage.competency.desc=Gives a user the ability to manage competency within the organization.
auth.can.propose.role.competencies.desc=Give a user the ability to propose competencies and their weightages for a role.
auth.can.manage.career.pathway.desc=Allows user to manage career pathway for each role within the organization.
auth.can.manage.org.chart.desc=Allows user to manage organizational chart structure of the organization.
auth.can.manage.training.desc=Allows a user to manage training in the system.
auth.can.assign.training.desc=Allows a user to assign training sessions to staff and track their participation.
auth.can.manage.learning.material.desc=Allows a user to create, edit, view, and delete learning materials in the system.
auth.can.manage.evaluation.desc=Allows a user to assess staff performance by scoring predefined competencies.
auth.can.manage.evaluation.cycle.desc=Allows a user to schedule evaluation period.

