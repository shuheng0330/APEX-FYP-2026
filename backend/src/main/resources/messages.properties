role.assignment.staff.email.notes=Email address of the staff being assigned. Must match an existing registered user in the system; use ';' to separate multiple entries.
competency.definition.name.notes=Name of the competency. Must be unique within the existing competency name in the system.
competency.definition.desc.notes=Notes or additional context for the competency. (Optional)
competency.definition.tags.notes=Tag assigned to this role; use ';' to separate multiple entries. (Optional)
competency.definition.new.name.notes=New name of the competency. Must be unique within the existing competency name in the system. (Optional)
competency.definition.deleted.notes=Indicates if the competency should be deleted. Enter 'Yes' to request deletion. (Optional)
competency.assignment.department.name.notes=Department to which the role belongs. Must match a valid department name.
competency.assignment.role.name.notes=The role to which the competency is assigned. Must match an existing role name within the department.
competency.assignment.competency.weightage.notes=Name of the competency to be assigned and its evaluation weight. Using the format (Competency Name > Weightage). Separate multiple entries with a semicolon ';'.
